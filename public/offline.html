<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Kingdom Passion Academy — Offline</title>
  <style>
    body {
      margin: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background: #1B2B5E;
      color: white;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      text-align: center;
      padding: 24px;
    }
    .card { max-width: 360px; }
    h1 { color: #C9A84C; font-size: 20px; margin-bottom: 8px; }
    p { color: rgba(255,255,255,0.7); font-size: 14px; line-height: 1.5; }
    button {
      margin-top: 20px;
      background: #C9A84C;
      color: #1B2B5E;
      border: none;
      padding: 12px 24px;
      border-radius: 8px;
      font-weight: 600;
      font-size: 14px;
    }
  </style>
</head>
<body>
  <div class="card">
    <h1>Kingdom Passion Academy</h1>
    <p>
      No internet connection right now. Reconnect and try again —
      <br />
      Pas de connexion internet. Reconnectez-vous et réessayez.
    </p>
    <button onclick="window.location.reload()">Retry / Réessayer</button>
  </div>
</body>
</html>
