name: KPA-OS CI

on:
  push:
    branches: [main, kpa-os-v2-foundation]
  pull_request:
    branches: [main]

concurrency:
  group: kpa-os-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node 24
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      # Until the dependency lockfile is committed, npm ci cannot be used.
      - name: Install dependencies
        run: npm install --no-audit --no-fund

      - name: Type-check
        run: npm run typecheck

      - name: Production build
        run: npm run build
        env:
          NEXT_TELEMETRY_DISABLED: 1

      - name: Verify repository state
        run: git diff --exit-code
