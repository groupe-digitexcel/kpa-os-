name: KPA-OS CI

on:
  push:
    branches: [main, kpa-os-v2-foundation]
  pull_request:
    branches: [main]

concurrency:
  group: kpa-os-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node 20
        uses: actions/setup-node@v4
        with:
          node-version: 20

      # The repository currently has no package-lock.json, so npm ci would
      # fail before the actual quality checks. Use npm install until the lock
      # file is generated and committed in the dependency-freeze phase.
      - name: Install dependencies
        run: npm install --no-audit --no-fund

      - name: Type-check
        run: npm run typecheck

      - name: Production build
        run: npm run build
        env:
          NEXT_TELEMETRY_DISABLED: 1

      - name: Verify repository state
        run: git diff --exit-code
