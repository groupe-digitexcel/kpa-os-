[package]
name = "kpa-os"
version = "0.1.0"
description = "Kingdom Passion Academy — School Operations System (Desktop)"
authors = ["Kingdom Passion Academy"]
edition = "2021"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-shell = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[profile.release]
panic = "abort"
codegen-units = 1
lto = true
opt-level = "s"
strip = true
